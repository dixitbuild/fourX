[project]
name = "fourx"
version = "0.1.0"
description = "Human-approved CLI invoice agent with durable sessions"
readme = "README.md"
authors = [
    { name = "dixit", email = "dixitbuild@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0,<2",
    "groq>=0.30,<2",
    "mcp>=1.2,<2",
    "openai>=3.42.0",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
fourx = "fourx:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
